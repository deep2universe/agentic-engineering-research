# Dev-Stack (Docker-Variante): Postgres, SonarQube, Grafana, Prometheus, Loki, Alloy.
# Start: scripts/40_compose_up.sh   |   Stop: scripts/99_stop.sh compose
# Hinweis: Ausgehendes HTTPS aus Containern ist TLS-intercepted. Braucht ein Container
# Internet (z. B. Plugin-Download), das CA-Bundle mounten:
#   /root/.ccr/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro   (Debian/Alpine-Images)
name: devstack

services:
  postgres:
    image: postgres:${POSTGRES_TAG:-16-alpine}
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d appdb"]
      interval: 5s
      retries: 20

  sonarqube:
    image: sonarqube:${SONARQUBE_TAG:-community}
    # Wrapper schaltet ES-Disk-Watermarks ab (Sandbox-Disk-Quota), siehe sonar-entrypoint.sh
    entrypoint: ["/bin/bash", "/opt/sandbox/sonar-entrypoint.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Sandbox: Hard-Limit nofile=20000, nicht anhebbar (kein CAP_SYS_RESOURCE).
      # Elasticsearch verlangt 65535 -> Bootstrap-Checks abschalten (nur Dev!).
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports: ["9000:9000"]
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
      - ./sonarqube/sonar-entrypoint.sh:/opt/sandbox/sonar-entrypoint.sh:ro

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-latest}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver   # fuer OTLP-Metriken via Alloy
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:${LOKI_TAG:-latest}
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["3100:3100"]

  alloy:
    image: grafana/alloy:${ALLOY_TAG:-latest}
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"   # Alloy UI
      - "12347:12347"   # Faro (React/Browser)
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
    depends_on: [loki, prometheus]

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-latest}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3000:3000"]
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/devstack_overview.json:/var/lib/grafana/dashboards/devstack_overview.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]

volumes:
  pg-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
  grafana-data:
